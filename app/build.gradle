plugins {
    id 'com.android.application'
}

android {
    namespace 'com.phonetoll.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.phonetoll.app'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
}
